name: Fehler melden
description: Einen reproduzierbaren Fehler mit ausschließlich synthetischen Daten melden
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **Datenschutz:** Keine echten Claude-Exporte, Chattexte, Screenshots mit privaten Inhalten, Zugangsdaten oder lokale Benutzerpfade anhängen.
  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduktionsschritte
      description: Bitte nur minimierte, synthetische Beispieldaten verwenden.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: z. B. 1.0.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows-Version
      placeholder: z. B. Windows 11 24H2
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutzbestätigung
      options:
        - label: Ich habe keine echten Chatdaten, persönlichen Informationen oder Geheimnisse beigefügt.
          required: true
