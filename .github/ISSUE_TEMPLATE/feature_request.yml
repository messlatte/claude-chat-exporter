name: Funktion vorschlagen
description: Eine Idee oder Verbesserung vorschlagen
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Bitte keine echten Claude-Exporte oder persönlichen Chat-Inhalte anhängen.
  - type: textarea
    id: problem
    attributes:
      label: Ausgangsproblem
      description: Welches konkrete Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Gewünschte Lösung
      description: Wie sollte sich die App verhalten?
    validations:
      required: true
