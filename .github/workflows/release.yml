name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Verify release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $expected = "StringStruct('ProductVersion', '$version')"
          if (-not (Select-String -LiteralPath .\assets\version_info.txt -SimpleMatch -Pattern $expected -Quiet)) {
            throw "Tag $env:GITHUB_REF_NAME stimmt nicht mit assets/version_info.txt überein."
          }

      - name: Build Windows EXE
        shell: pwsh
        run: .\build_windows.ps1

      - name: Create release bundle and checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assetName = "Claude-Chat-Exporter-$version.exe"
          $bundleName = "Claude-Chat-Exporter-$version-with-licenses.zip"
          Copy-Item -LiteralPath .\dist\Claude-Chat-Exporter.exe -Destination ".\dist\$assetName"

          $bundleDir = ".\dist\release-bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item -LiteralPath ".\dist\$assetName" -Destination $bundleDir
          Copy-Item -LiteralPath .\LICENSE -Destination $bundleDir
          Copy-Item -LiteralPath .\THIRD_PARTY_NOTICES.md -Destination $bundleDir
          Copy-Item -LiteralPath .\third_party_licenses -Destination $bundleDir -Recurse
          Compress-Archive -Path "$bundleDir\*" -DestinationPath ".\dist\$bundleName" -Force

          $checksums = foreach ($name in @($assetName, $bundleName)) {
            $hash = (Get-FileHash ".\dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assetName = "Claude-Chat-Exporter-$version.exe"
          $bundleName = "Claude-Chat-Exporter-$version-with-licenses.zip"
          gh release create $env:GITHUB_REF_NAME `
            ".\dist\$assetName" `
            ".\dist\$bundleName" `
            .\dist\SHA256SUMS.txt `
            --verify-tag `
            --title "Claude Chat Exporter $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md
